services:
  web:
    build: .
    image: scanseo:dev
    env_file: .env
    ports: ["127.0.0.1:30024:3000"]
    volumes:
      - ./var/data:/data
      - ./var/reports:/reports
      - ./var/content:/content

  worker:
    image: scanseo:dev
    env_file: .env
    command: ["node", "worker.js"]
    depends_on: [web]
    volumes:
      - ./var/data:/data
      - ./var/reports:/reports
      - ./var/content:/content
